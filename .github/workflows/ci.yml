name: CI

# Nota (17/09/2026): as actions abaixo estão fixadas na major version mais
# recente de cada uma (checkout@v7, setup-java@v5, upload-artifact@v7) -
# fixar só a major (em vez do SHA exato do commit ou de uma versão menor)
# é a prática recomendada pela própria GitHub: recebe automaticamente
# patches/minor releases (correções de bug, novas versões de runtime
# Node.js suportadas) sem quebrar a interface do "with:" usada aqui. As
# versões acima já corrigem o aviso de depreciação visto no primeiro run
# deste workflow ("Node.js 20 is deprecated" / "setup-java v4 is
# deprecated") - as v4 usadas originalmente ainda rodavam sobre Node.js 20,
# enquanto as majors atuais já rodam sobre um runtime mais novo.
#
# Quando este workflow roda:
# - em todo push para main/master (ex: merge de PR, ou push direto);
# - em todo pull request que tenha main/master como destino - assim o
#   resultado aparece já na tela do PR, ANTES do merge, que é o ponto em
#   que um teste quebrado é mais barato de corrigir.
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

  # Permite rodar manualmente pela aba "Actions" do GitHub, sem precisar de
  # push/PR - útil para reexecutar depois de uma falha de infraestrutura
  # (ex: timeout do Maven Central) sem precisar criar um commit vazio.
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, testes, cobertura (JaCoCo) e qualidade estática (Checkstyle/SpotBugs)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configura o JDK 25 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          # Cacheia o repositório local do Maven (~/.m2) entre execuções -
          # evita rebaixar as mesmas dependências (Spring Boot, JUnit,
          # Mockito etc.) a cada run, deixando o pipeline bem mais rápido.
          cache: 'maven'

      # "mvn verify" (sessão de 18/09/2026 - antes era só "mvn test") passa
      # por TODAS as fases do ciclo de vida do Maven até "verify", nesta
      # ordem, cada uma um gate diferente:
      #   1. validate - Checkstyle (checkstyle.xml): análise estática do
      #      CÓDIGO-FONTE (bugs estruturais, import não usado etc.) - roda
      #      primeiro, antes até de compilar, então falha rápido e barato.
      #   2. test - os testes de unidade + o gate de cobertura mínima do
      #      JaCoCo ("jacoco:check", ver pom.xml) - o que já rodava antes.
      #   3. package - gera o JAR executável (spring-boot-maven-plugin).
      #   4. verify - SpotBugs: análise estática do BYTECODE compilado
      #      (padrões de bug reais, ex: possível NPE) - por isso só pode
      #      rodar depois de compilar/empacotar.
      # Ver pom.xml para o racional completo de cada plugin/versão.
      #
      # "-B" (batch mode) desliga prompts interativos do Maven, que não
      # fazem sentido em CI.
      #
      # NOTA ATUALIZADA (21/09/2026 - a nota original aqui, de antes da
      # suíte de Cucumber existir, dizia que "nenhum banco de dados é
      # necessário"; isso deixou de ser verdade e o texto abaixo substitui
      # aquele): "mvn verify" também roda a suíte funcional/E2E de Cucumber
      # (fase "integration-test"/failsafe - ver RunCucumberIT), que sobe um
      # container REAL de MySQL via Testcontainers. Isso funciona AQUI sem
      # nenhuma configuração extra de "services:" no workflow porque
      # runners hospedados do GitHub (ubuntu-latest) já vêm com o Docker
      # instalado e disponível de fábrica - é só o Docker que o
      # Testcontainers precisa encontrar, não uma instância de MySQL já
      # rodando (o container é subido e derrubado pelo próprio teste). Ver
      # pom.xml (comentário do maven-failsafe-plugin) para o racional
      # completo dessa suíte.
      # Usa o Maven já instalado na imagem do runner (ubuntu-latest já vem
      # com uma versão recente do Maven). O projeto não versiona o Maven
      # Wrapper (mvnw/mvnw.cmd) ainda - ver nota no README sobre isso como
      # possível melhoria futura (fixaria a versão exata do Maven usada em
      # CI e por qualquer dev que clone o repositório, independente do que
      # estiver instalado na máquina).
      - name: Build completo + testes + cobertura + qualidade estática (mvn verify)
        run: mvn -B verify

      # Sobe o relatório HTML/CSV do JaCoCo como artefato do run, para dar
      # uma olhada na cobertura linha a linha direto pela interface do
      # GitHub Actions, sem precisar rodar localmente.
      - name: Publicar relatório de cobertura (JaCoCo) como artefato
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 15

      # "if: always()" aqui é o que importa de verdade: sem isso, o step de
      # upload seria PULADO justamente no caso mais útil - quando o
      # "mvn verify" acima falhou por causa do SpotBugs, o job para no meio
      # e os steps seguintes não rodam por padrão. Com "always()", mesmo um
      # SpotBugs vermelho ainda deixa o XML (com o detalhe de CADA achado)
      # disponível pra baixar e investigar, sem precisar reproduzir
      # localmente só para ver o que disparou.
      - name: Publicar relatório de análise estática (SpotBugs) como artefato
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          retention-days: 15
          if-no-files-found: ignore

      # Acrescentado em 21/09/2026: até então, o único jeito de confirmar
      # que a suíte de Cucumber (100 cenários) realmente rodou era abrir o
      # log bruto (texto solto, sem destaque) do step "mvn verify" acima e
      # procurar por "Tests run:" no meio de milhares de linhas - dava a
      # falsa impressão de que os testes funcionais não tinham sido
      # executados, quando na verdade só não havia NENHUM arquivo de
      # relatório gerado para publicar (RunCucumberIT usava só o plugin
      # "pretty", que escreve apenas no console). Agora RunCucumberIT
      # também gera "html"/"json" (ver
      # src/test/java/.../cucumber/RunCucumberIT.java), e este step sobe
      # esse HTML como artefato clicável - mesmo padrão do JaCoCo acima.
      - name: Publicar relatório de testes funcionais (Cucumber) como artefato
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cucumber-report
          path: target/cucumber-reports/
          retention-days: 15
          if-no-files-found: warn
